{% extends "base.html" %}
{% block title %}Đăng nhập · ImgFlow{% endblock %}
{% block content %}
<section class="card narrow auth">
  <h1>Đăng nhập shop</h1>
  <p class="muted">Quản lý và xem ảnh sản phẩm đã xử lý của shop bạn.</p>
  {% if error %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Tên đăng nhập <input name="username" required autofocus autocomplete="username"></label>
    <label>Mật khẩu <input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary btn-block">Đăng nhập</button>
  </form>
  <p class="muted center">Chưa có shop? <a href="{{ url_for('register') }}">Tạo shop</a></p>
</section>
{% endblock %}
