{% extends "base.html" %}
{% block title %}Đăng nhập · ImgFlow{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Đăng nhập shop</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Tên đăng nhập <input name="username" required autofocus></label>
    <label>Mật khẩu <input name="password" type="password" required></label>
    <button>Đăng nhập</button>
  </form>
  <p class="muted">Chưa có shop? <a href="{{ url_for('register') }}">Tạo shop</a></p>
</section>
{% endblock %}
