<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ImgFlow{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><circle cx="11" cy="11" r="3.2" fill="#fff"/><path d="M5 25.5l7-7.5 4.5 4.5 3.8-4 6.7 7z" fill="#fff"/></svg>ImgFlow</a>
    {% if session.get('shop_id') %}
      <span class="shop-chip" title="Shop đang đăng nhập">{{ session.get('shop_name') }}</span>
      <form method="post" action="{{ url_for('logout') }}"><button class="btn btn-ghost">Đăng xuất</button></form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="footer">ImgFlow · xử lý ảnh sản phẩm tự động trên AWS</footer>
</body>
</html>
